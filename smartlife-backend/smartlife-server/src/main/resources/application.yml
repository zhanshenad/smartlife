server:
  port: 8086

spring:
  application:
    name: smartlife-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smartlife?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${SMARTLIFE_DB_USERNAME:root}
    password: ${SMARTLIFE_DB_PASSWORD:smartlife-dev}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      # 连接泄漏检测：超过 60 秒没归还就告警，帮你在开发期就发现忘关事务
      leak-detection-threshold: 60000

  data:
    # ⚠️ 是 spring.data.redis 不是 spring.redis（SB3 改了前缀）
    redis:
      host: localhost
      port: 6379
      # 专用库，避开苍穹外卖(db0)与黑马点评(db1)，防止 flushdb 时误伤
      database: 2
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  rabbitmq:
    host: localhost
    port: 5672
    # guest 只能容器内 localhost 连接（loopback 限制），故建专用账号
    username: smartlife
    password: smartlife123
    virtual-host: /
    # 生产者确认：broker 收到消息后异步回 ack/nack，配合 CorrelationData.getFuture() 同步等待。
    # correlated 才带 future，simple 模式只能全局回调、拿不到单条消息的结果。
    publisher-confirm-type: correlated
    # 消息到了交换机但路由不到队列时触发 ReturnsCallback（拓扑被改坏的告警）
    publisher-returns: true
    template:
      # returns 生效的前提：不设 mandatory，broker 会静默丢弃无法路由的消息
      mandatory: true
    listener:
      simple:
        # 手动 ACK：成功 basicAck，异常 basicNack(requeue=false) 进死信，
        # 防止毒消息无限重投（§5.2.6 设计点 2）
        acknowledge-mode: manual
        prefetch: 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线前关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

smartlife:
  jwt:
    # ⚠️ HS256 要求密钥不少于 256 位（32 字节），太短会在启动时抛 WeakKeyException
    # 这个默认值是公开的，任何人都能拿它伪造 token —— 生产必须用环境变量覆盖：
    #   set SMARTLIFE_JWT_SECRET=<一段足够长的随机串>
    # 注意：本项目的第二道防线（Redis 会话白名单）已改为以 Redis 中的 role 为准（见 TokenInterceptor），
    # 所以即便密钥泄漏，伪造的 token 也只能拿到攻击者自己的真实权限，无法提权。
    secret: ${SMARTLIFE_JWT_SECRET:smartlife-jwt-secret-key-2026-please-change-in-production}
    # JWT 只管签名有效，故意设得远大于 Redis 会话 TTL(30min)
    expire-minutes: 1440
  order:
    # 演示/压测时改成 1，不然等 15 分钟太煎熬（§5.2.6）
    timeout-minutes: 15
  oss:
    # 假值占位，真值在 application-local.yml（gitignore）或环境变量里
    endpoint: ${SMARTLIFE_OSS_ENDPOINT:https://oss-cn-hangzhou.aliyuncs.com}
    bucket: ${SMARTLIFE_OSS_BUCKET:your-bucket-name}
    access-key-id: ${SMARTLIFE_OSS_AK_ID:fake-ak-id}
    access-key-secret: ${SMARTLIFE_OSS_AK_SECRET:fake-ak-secret}

logging:
  level:
    com.smartlife: debug
