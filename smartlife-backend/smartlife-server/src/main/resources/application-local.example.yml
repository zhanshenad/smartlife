# 本地配置模板。
# 用法：复制为 application-local.yml 后填入本机真实值（该文件已被 .gitignore 排除，不会入库）。
# 这里列出的每一项都能用同名环境变量替代，见 application.yml 里的 ${...} 占位符。
# 什么都不填也能启动：application.yml 里给了开发用的默认值，够本机跑通。

spring:
  datasource:
    # 数据库密码。也可用环境变量 SMARTLIFE_DB_PASSWORD
    password: your-db-password

smartlife:
  # 图片上传用的对象存储。不用上传功能的话整段可以删掉，启动不受影响
  oss:
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    bucket: your-bucket-name
    access-key-id: your-access-key-id
    access-key-secret: your-access-key-secret
